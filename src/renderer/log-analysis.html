<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>日志分析 - Test cat</title>
    <link rel="stylesheet" href="log-analysis.css" />
  </head>
  <body>
    <div class="log-shell">
      <header class="log-titlebar">
        <div class="log-brand"><img src="../../assets/modules/log-analysis.png" alt="" /><div><strong>日志分析</strong><span>Test cat · Android logcat</span></div></div>
        <div class="title-status"><i id="title-status-dot"></i><span id="title-status-text">等待连接设备</span></div>
      </header>

      <main class="log-workspace">
        <section class="connection-panel">
          <label class="field device-field">Android 设备<select id="log-device"><option value="">正在查找设备…</option></select></label>
          <button class="button secondary" id="log-refresh">↻ 刷新设备</button>
          <label class="field scope-field">日志范围<select id="log-scope"><option value="device">整机日志</option><option value="app">指定 App 日志</option></select></label>
          <label class="field package-field">App 包名<input id="log-package" placeholder="指定 App 日志时填写" /></label>
          <button class="button secondary" id="log-foreground">读取前台 App</button>
          <label class="check"><input id="log-clear-device" type="checkbox" /><span>开始前清空旧日志</span></label>
          <button class="button primary" id="log-start" disabled>▶ 开始监听</button>
          <button class="button danger" id="log-stop" disabled>■ 停止</button>
        </section>

        <section class="filter-panel">
          <div class="filter-row">
            <label class="search-box"><span>⌕</span><input id="log-keyword" placeholder="过滤关键字、error、接口路径…" /></label>
            <label class="compact-field">接口名<input id="log-interface" placeholder="例如 /api/login" /></label>
            <label class="compact-field">玩家 ID<input id="log-player" placeholder="例如 1008611" /></label>
            <label class="compact-field level-field">最低级别<select id="log-level"><option value="all">全部</option><option value="V">Verbose</option><option value="D">Debug</option><option value="I">Info</option><option value="W">Warn</option><option value="E">Error</option><option value="F">Fatal</option></select></label>
          </div>
          <div class="filter-bottom">
            <div class="kind-filters" role="group" aria-label="日志类型">
              <button class="active" data-kind="all">全部日志</button>
              <button data-kind="error">报错</button>
              <button data-kind="crash">崩溃</button>
              <button data-kind="anr">ANR</button>
              <button data-kind="exception">异常 / 堆栈</button>
            </div>
            <div class="display-tools">
              <label class="check"><input id="log-follow" type="checkbox" checked /><span>自动滚动</span></label>
              <button class="text-button" id="log-pause">暂停显示</button>
              <button class="text-button" id="log-clear-view">清空页面</button>
            </div>
          </div>
        </section>

        <section class="log-summary">
          <div><span>当前显示</span><strong id="visible-count">0</strong></div>
          <div><span>已接收</span><strong id="total-count">0</strong></div>
          <div class="danger-stat"><span>崩溃</span><strong id="crash-count">0</strong></div>
          <div class="danger-stat"><span>ANR</span><strong id="anr-count">0</strong></div>
          <div class="warning-stat"><span>异常 / 报错</span><strong id="error-count">0</strong></div>
          <p id="display-note">连接设备并点击“开始监听”，日志会实时出现在这里。</p>
        </section>

        <div class="analysis-layout">
          <section class="console-panel">
            <header><div><h2>实时日志</h2><p><span class="legend crash"></span>崩溃 / ANR <span class="legend error"></span>异常 / 报错 <span class="legend warning"></span>警告</p></div><span id="stream-badge">未监听</span></header>
            <div class="console-head"><span>时间</span><span>级别</span><span>PID / 进程</span><span>Tag</span><span>日志内容</span></div>
            <div class="log-list" id="log-list" role="log" aria-live="off"></div>
            <div class="log-empty" id="log-empty"><img src="../../assets/modules/log-analysis.png" alt="" /><h3>等待 Android 日志</h3><p>支持关键字、接口名和玩家 ID 组合筛选。</p></div>
          </section>

          <aside class="issue-panel">
            <header><div><h2>异常事件</h2><p>自动定位崩溃、ANR 和异常堆栈</p></div><b id="issue-count">0</b></header>
            <div class="issue-list" id="issue-list"></div>
            <div class="issue-empty" id="issue-empty"><span>✓</span><strong>暂未发现异常</strong><p>检测到问题后会自动显示在这里。</p></div>
          </aside>
        </div>

        <footer class="export-bar">
          <div><strong>日志导出</strong><span>可导出全部原始日志，或只导出当前筛选结果。</span></div>
          <label>导出范围<select id="export-scope"><option value="all">全部日志</option><option value="filtered">当前筛选结果</option></select></label>
          <label>文件格式<select id="export-format"><option value="log">原始日志 .log</option><option value="html">可视化报告 .html</option></select></label>
          <button class="button secondary" id="log-copy" disabled>复制筛选日志</button>
          <button class="button primary" id="log-export" disabled>⇩ 一键导出日志</button>
        </footer>
      </main>
    </div>
    <div class="toast" id="log-toast"></div>
    <script src="log-analysis.js"></script>
  </body>
</html>
